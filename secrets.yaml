# ============================================================
# 密钥/凭据模板 —— 填入你自己的值
# 注意: 不要把填了真实密码的 secrets.yaml 分享/提交到公开仓库
# ============================================================

# WiFi (ESP32 只支持 2.4GHz)
wifi_ssid: "你的WiFi名"
wifi_password: "你的WiFi密码"

# 断网回退热点的密码 (至少8位)
ap_password: "12345678"

# Home Assistant API 加密密钥 (32字节, base64)
# 生成: python -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())"
api_key: "在这里粘贴你生成的base64密钥"

# OTA 无线升级密码
ota_password: "12345678"