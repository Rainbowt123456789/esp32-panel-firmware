    # ---------------- 第 2 屏: 灯光 ----------------
    - id: page_light
      bg_color: 0x0B1026
      widgets:
        # 深色科技风渐变背景 (预渲染抖动图, 无横条)
        - image:
            id: bg_light
            src: bg_grad
            x: 0
            y: 0
            width: 480
            height: 480
        # ======================================================================
        # 灯光页 6 个开关按钮 (3列2排, 从左到右、从上到下编号1~6)
