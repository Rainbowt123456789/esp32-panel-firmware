            width: 480
            height: 480
        - label:
            x: 0
            y: 12
            width: 480
            height: 40
            text: "家庭信息"
            text_font: font_cn_28
            text_align: center
        # 卡片1: 问候+人名+到家时长, 末尾同接天气(有雨/无雨)
        - container:
            x: 8
            y: 60
            width: 464
            height: 88
            bg_color: 0x161F3D
            border_color: 0x2A3A66
            border_width: 1
            radius: 18
            widgets:
              - label:
                  id: lbl_family_presence
                  x: 14
                  y: 10
                  width: 436
                  height: 30
                  text: !lambda |-
                    std::string s = id(ha_family_presence).state;
                    if (s.empty()) return std::string("等待 Home Assistant 数据...");
                    auto pick = [](const std::string& src, int idx) -> std::string {
                      std::string cur; int n = 0;
                      for (size_t i = 0; i <= src.size(); i++) {
                        if (i == src.size() || src[i] == '\n') {
                          size_t a = 0, b = cur.size();
                          while (a < b && (cur[a]==' '||cur[a]=='\t')) a++;
                          while (b > a && (cur[b-1]==' '||cur[b-1]=='\t')) b--;
                          std::string t = cur.substr(a, b - a);
                          if (!t.empty()) { if (n == idx) return t; n++; }
                          cur.clear();
                        } else cur += src[i];
                      }
                      return std::string("");
                    };
                    std::string line1 = pick(s, 0);
                    int c = id(g_weather_code);
                    if (c >= 0) {
                      bool rain = (c==51||c==53||c==55||c==61||c==63||c==65||c==66||c==67
                                ||c==80||c==81||c==82||c==95||c==96||c==99);
                      line1 += rain ? ".今天有雨" : ".今天无雨";
                    }
                    return line1;
                  text_font: font_cn_24
                  text_color: 0xFF9EC4
                  recolor: true
              - label:
                  id: lbl_room_living
                  x: 14
                  y: 44
                  width: 104
                  height: 30
                  text: !lambda |-
                    return std::string("客厅 ") + id(ha_room_living).state;
                  text_font: font_cn_24
                  text_color: !lambda |-
                    return lv_color_hex(id(ha_room_living).state == "有人" ? 0xFF6B6B : 0x8A98A8);
              - label:
                  id: lbl_room_master
                  x: 124
                  y: 44
                  width: 104
                  height: 30
                  text: !lambda |-
                    return std::string("主卧 ") + id(ha_room_master).state;
                  text_font: font_cn_24
                  text_color: !lambda |-
                    return lv_color_hex(id(ha_room_master).state == "有人" ? 0xFF6B6B : 0x8A98A8);
              - label:
                  id: lbl_room_bath2
