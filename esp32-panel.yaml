            border_width: 1
            radius: 10
            on_click:
              - lambda: |-
                  int t = atoi(id(bg_theme_text).state.c_str());
                  t = (t + 1) % 3;
                  char b[4]; snprintf(b, sizeof(b), "%d", t);
                  id(bg_theme_text).make_call().set_value(b).perform();
              - lvgl.widget.refresh: [bg_theme_btn]
            widgets:
              - label:
                  id: bg_theme_btn
                  x: -20
                  y: -10
                  width: 110
                  text: !lambda |-
                      int t = atoi(id(bg_theme_text).state.c_str());
                      const char* nm = t==0 ? "深蓝" : t==1 ? "深紫" : "深粉";
                      char buf[32]; snprintf(buf, sizeof(buf), "背景:%s", nm);
                      return std::string(buf);
                  text_font: font_cn_20
                  text_align: center
                  text_color: 0x8A98A8
