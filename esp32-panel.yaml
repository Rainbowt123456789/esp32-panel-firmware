# ============================================================
# LVGL 中文 5 屏 UI
# 屏结构: 首页 / 灯光 / 开关 / 场景 / 设置 (底部导航)
# 动态文本: label 的 text 用 time_format / printf_format / lambda 声明,
#           由 lvgl.widget.refresh 定期重新求值
# ============================================================
lvgl:
  displays: my_display
  touchscreens: my_touchscreen
  disp_bg_color: 0x0F141A
  # 滑条静态水平渐变(声明式, 不随拖动实时变色)
  gradients:
    # 色温: 左冷蓝(6500K) -> 右暖橙(2700K)
    - id: g_temp_grad
      direction: HOR
      stops:
        - color: 0x8FC7FF
          position: 0%
        - color: 0xFFB35C
          position: 100%
    # 亮度: 左暗 -> 右亮
    - id: g_bright_grad
      direction: HOR
      stops:
        - color: 0x232C3D
          position: 0%
        - color: 0xFFE39E
          position: 100%
  theme:
    dark_mode: true
    button:
      bg_color: 0x1A2138
      pressed:
        bg_color: 0x2A3A66
      checked:
        bg_color: 0x00D4FF
        text_color: 0x0B1026
      text_color: 0xE8EDF2
      radius: 14
    label:
      text_color: 0xE8EDF2
    slider:
      bg_color: 0x1A2138
  pages:
    # ---------------- 第 1 屏: 首页 (信息聚合 · 大字时钟) ----------------
    - id: page_home
      bg_color: 0x0B1026
      widgets:
        # 深色科技风渐变背景 (预渲染抖动图, 无横条)
        - image:
            id: bg_home
            src: bg_grad
            x: 0
            y: 0
            width: 480
            height: 480
        # 顶部: 家庭名 (左上) + 日期 (右上)
        - label:
            id: lbl_home_name
            x: 20
            y: 4
            width: 220
            height: 26
            text: !lambda |-
              return id(home_name_text).state;
            text_font: font_cn_20
            text_color: 0x4CD964
        - label:
            id: lbl_date
            x: 268
            y: 6
            width: 192
            height: 26
            text:
              format: "%d月%d日 星期%s"
              args:
                - 'id(my_time).now().is_valid() ? id(my_time).now().month : 0'
                - 'id(my_time).now().is_valid() ? id(my_time).now().day_of_month : 0'
                - '([]() -> const char* { static const char* wk[]={"日","一","二","三","四","五","六"}; return id(my_time).now().is_valid() ? wk[id(my_time).now().day_of_week - 1] : "?"; }())'
            text_font: font_cn_20
            text_align: right
            text_color: 0x8A98A8
        # WiFi 状态图标: 绿=好 / 黄=弱 / 红=断网
        - label:
            id: lbl_wifi_icon
            x: 270
            y: 8
            width: 22
            height: 22
            text: !lambda |-
              if (!id(wifi_sig).has_state()) return "󰖪";  // 断网
              int s = (int) id(wifi_sig).state;
              if (s > -65) return "󰖩";   // 强
              if (s > -80) return "󰖨";   // 中
              return "󰖩";                // 弱(也显示wifi, 靠颜色区分)
            text_font: font_mdi_24
            text_align: center
            text_color: !lambda |-
              if (!id(wifi_sig).has_state()) return lv_color_hex(0xFF453A);  // 断网红
              int s = (int) id(wifi_sig).state;
              if (s > -65) return lv_color_hex(0x4CD964);
              if (s > -80) return lv_color_hex(0xFFCC00);
              return lv_color_hex(0xFF9500);
        # 大字时钟 (左侧, 64px) + 右侧天气信息
        - label:
            id: lbl_time
            x: 16
            y: 25
            width: 268
            height: 150
            text:
              time_format: "%H:%M"
              time: my_time
            text_font: font_digits_105
            text_align: left
            text_color: 0xFF8C00
        # 右侧: 天气图标 (太阳/月亮, 按时段) + 实时温度 (Open-Meteo API)
        - label:
            id: lbl_weather_icon
            x: 287
            y: 66
            width: 84
            height: 84
            text: !lambda |-
              auto now = id(my_time).now();
              bool night = now.is_valid() && !(now.hour >= 6 && now.hour < 18);
              switch (id(g_weather_code)) {
                case 0: return std::string(night ? "󰖔" : "󰖙");
                case 1: case 2: return std::string("󰖕");
                case 3: return std::string("󰖐");
                case 45: case 48: return std::string("󰖑");
                case 51: case 53: case 55: case 61: case 63: case 65: case 66: case 67:
                case 80: case 81: case 82: return std::string("󰖗");
                case 71: case 73: case 75: case 77: case 85: case 86: return std::string("󰖘");
                case 95: case 96: case 99: return std::string("󰖓");
                default: return std::string(night ? "󰖔" : "󰖕");
              }
            text_font: font_mdi_80
            text_align: center
            text_color: 0xFFC94C
        # 天气信息文本列 (城市名/天气/温度/湿度)
        - label:
            id: lbl_weather_city
            x: 379
            y: 65
            width: 96
            height: 26
            text: !lambda |-
              std::string c = id(city_text).state;   // 天气城市(HA text 实体可改)
              if (c.empty()) c = "本地";
              return c;
            text_font: font_cn_20
            text_align: left
            text_color: 0xFFC94C
        - label:
            id: lbl_weather_desc
            x: 379
            y: 89
            width: 96
            height: 26
            text: !lambda |-
              return id(g_weather);
            text_font: font_cn_20
            text_align: left
            text_color: 0xFFFFFF
        - label:
            id: lbl_weather_temp
            x: 379
            y: 113
            width: 96
            height: 26
            text: !lambda |-
              if (std::isnan(id(g_weather_temp))) return std::string("--");
              char buf[16];
              snprintf(buf, sizeof(buf), "%.0f°C", id(g_weather_temp));
              return std::string(buf);
            text_font: font_cn_20
            text_align: left
            text_color: 0xFFFFFF
        
        # 自定义文本 (HA text 实体可改; 自动判断: ≤22字整段静止, 超出按每20字切段, 每3秒轮播)
        - label:
            id: lbl_greet
            x: 20
            y: 173
            width: 440
            height: 30
            text: !lambda |-
              std::string s = id(home_quote).state;
              size_t ta = s.find_first_not_of(" \t|");
              if (ta == std::string::npos) return std::string("");
              size_t tb = s.find_last_not_of(" \t|");
              s = s.substr(ta, tb - ta + 1);
              // 统计可见字符(UTF-8中文3字节=1字, ASCII=1字)
              int total = 0;
              for (size_t i = 0; i < s.size();) {
                unsigned char c = (unsigned char)s[i];
                total++;
                i += (c >= 0x80) ? 3 : 1;
              }
              if (total <= 22) return s;
              // 超22字: 按每20字自动切段
              std::vector<std::string> segs;
              int cnt = 0; size_t st = 0;
              for (size_t i = 0; i < s.size();) {
                unsigned char c = (unsigned char)s[i];
                int adv = (c >= 0x80) ? 3 : 1;
                if (cnt >= 20) { segs.push_back(s.substr(st, i - st)); st = i; cnt = 0; }
                cnt++; i += adv;
              }
              segs.push_back(s.substr(st));
              int n = segs.size();
              return segs[id(g_greet_seg) % n];
            text_font: font_cn_20
            text_align: center
            text_color: 0x00D4FF
        # ---------- 六卡信息区 (3 列 x 2 行, 玻璃质感+霓虹光) ----------
        # 天气 (HA 中间实体 sensor.panel_weather, 文本: 晴/多云/雨...)
        - container:
            id: card_weather
            x: 16
            y: 226
            width: 145
            height: 82
            bg_color: 0x141B33
            border_color: 0x2A3A66
            border_width: 1
            radius: 18
            drop_shadow_color: 0xFFC94C
            drop_shadow_opa: 22%
            drop_shadow_radius: 12
            widgets:
              - label:
                  x: 12
                  y: 6
                  text: "󰋜"
                  text_font: font_mdi_24
                  text_align: center
                  text_color: 0x00D4FF
              - label:
                  id: lbl_card1_title
                  x: 48
                  y: 4
                  text: !lambda |-
                    std::string t = id(card1_title_text).state;
                    if (t.empty()) t = "系统";
                    return t;
                  text_font: font_cn_20
                  text_color: 0x8A98A8
              - label:
                  id: lbl_weather
                  x: 14
                  y: 38
                  width: 120
                  height: 32
                  text: !lambda |-
                    float c = id(ha_card1).has_state() ? id(ha_card1).state : NAN;
                    if (!std::isfinite(c)) return std::string("--");
                    if (c <= 0) return std::string("无快递");
                    char buf[24];
                    snprintf(buf, sizeof(buf), "%d个快递待取", (int)c);
                    return std::string(buf);
                  text_font: font_cn_20
                  text_align: center
                  text_color: 0xFFFFFF
        # 温度 (HA 中间实体 sensor.panel_temp)
        - container:
            id: card_temp
            x: 168
            y: 226
            width: 145
            height: 82
            bg_color: 0x141B33
            border_color: 0x2A3A66
            border_width: 1
            radius: 18
            drop_shadow_color: 0xFF8A4C
            drop_shadow_opa: 22%
            drop_shadow_radius: 12
            widgets:
              - label:
                  x: 12
                  y: 6
                  text: "󰔏"
                  text_font: font_mdi_24
                  text_color: 0xFF8A4C
              - label:
                  x: 48
                  y: 4
                  text: "室内温度"
                  text_font: font_cn_20
                  text_color: 0x8A98A8
              - label:
                  id: lbl_temp
                  x: 14
                  y: 38
                  width: 120
                  height: 32
                  text:
                    format: "%.1f℃"
                    args:
                      - 'id(ha_temp).has_state() ? id(ha_temp).state : NAN'
                    if_nan: "--"
                  text_font: font_cn_24
                  text_align: center
                  text_color: 0xFFFFFF
              
        # 湿度 (HA 中间实体 sensor.panel_hum)
        - container:
            id: card_hum
            x: 320
            y: 226
            width: 145
            height: 82
            bg_color: 0x141B33
            border_color: 0x2A3A66
            border_width: 1
            radius: 18
            drop_shadow_color: 0x4CB8FF
            drop_shadow_opa: 22%
            drop_shadow_radius: 12
            widgets:
              - label:
                  x: 12
                  y: 6
                  text: "󰖎"
                  text_font: font_mdi_24
                  text_color: 0x4CB8FF
              - label:
                  x: 48
                  y: 3
                  text: "室内湿度"
                  text_font: font_cn_20
                  text_color: 0x8A98A8
              - label:
                  id: lbl_hum
                  x: 14
                  y: 38
                  width: 120
                  height: 32
                  text: !lambda |-
                    float h = id(ha_hum).has_state() ? id(ha_hum).state : NAN;
                    if (!std::isfinite(h)) return std::string("--");
                    const char* lv;
                    if (h < 40) lv = "干燥";
                    else if (h < 60) lv = "舒适";
                    else if (h < 80) lv = "偏高";
                    else lv = "过高";
                    char buf[24];
                    snprintf(buf, sizeof(buf), "%.0f %s", h, lv);
                    return std::string(buf);
                  text_font: font_cn_24
                  text_align: center
                  text_color: 0x4CD964
             
        # 空气质量 (HA 中间实体 sensor.panel_air, AQI)
        - container:
            id: card_air
            x: 16
            y: 318
            width: 145
            height: 82
            bg_color: 0x141B33
            border_color: 0x2A3A66
            border_width: 1
            radius: 18
            drop_shadow_color: 0x4CD964
            drop_shadow_opa: 22%
            drop_shadow_radius: 12
            widgets:
              - label:
                  x: 12
                  y: 6
                  text: "󰵃"
                  text_font: font_mdi_24
                  text_color: 0x4CD964
              - label:
                  x: 48
                  y: 3
                  text: "空气质量"
                  text_font: font_cn_20
                  text_color: 0x8A98A8
              - label:
                  id: lbl_air
                  x: 14
                  y: 38
                  width: 120
                  height: 32
                  text: !lambda |-
                    float a = id(ha_air).has_state() ? id(ha_air).state : NAN;
                    if (!std::isfinite(a)) return std::string("--");
                    const char* lv;
                    if (a < 35) lv = "优";
                    else if (a < 75) lv = "良";
                    else if (a < 115) lv = "轻度";
                    else if (a < 150) lv = "中度";
                    else if (a < 250) lv = "重度";
                    else lv = "严重";
                    char buf[24];
                    snprintf(buf, sizeof(buf), "%.0f %s", a, lv);
                    return std::string(buf);
                  text_font: font_cn_24
                  text_align: center
                  text_color: 0x4CD964
              
        # 水质 (HA 中间实体 sensor.panel_water, TDS)
        - container:
            id: card_water
            x: 168
            y: 318
            width: 145
            height: 82
            bg_color: 0x141B33
            border_color: 0x2A3A66
            border_width: 1
            radius: 18
            drop_shadow_color: 0x00D4FF
            drop_shadow_opa: 22%
            drop_shadow_radius: 12
            widgets:
              - label:
                  x: 12
                  y: 6
                  text: "󰖌"
                  text_font: font_mdi_24
                  text_color: 0x00D4FF
              - label:
                  x: 48
                  y: 3
                  text: "水质"
                  text_font: font_cn_20
                  text_color: 0x8A98A8
              - label:
                  id: lbl_water
                  x: 14
                  y: 38
                  width: 120
                  height: 32
                  text: !lambda |-
                    float w = id(ha_water).has_state() ? id(ha_water).state : NAN;
                    if (!std::isfinite(w)) return std::string("--");
                    const char* lv;
                    if (w < 50) lv = "纯净";
                    else if (w < 150) lv = "优质";
                    else if (w < 300) lv = "良好";
                    else if (w < 450) lv = "一般";
                    else lv = "较差";
                    char buf[24];
                    snprintf(buf, sizeof(buf), "%.0f %s", w, lv);
                    return std::string(buf);
                  text_font: font_cn_24
                  text_align: center
                  text_color: 0x4CD964
            
        # 电费余额 (HA 中间实体 sensor.panel_elec)
        - container:
            id: card_elec
            x: 320
            y: 318
            width: 145
            height: 82
            bg_color: 0x141B33
            border_color: 0x2A3A66
            border_width: 1
            radius: 18
            drop_shadow_color: 0xFFC94C
            drop_shadow_opa: 22%
            drop_shadow_radius: 12
            widgets:
              - label:
                  x: 12
                  y: 6
                  text: "󰞺"
                  text_font: font_mdi_24
                  text_color: 0xFFC94C
              - label:
                  x: 48
                  y: 6
                  text: "电费余额"
                  text_font: font_cn_20
                  text_color: 0x8A98A8
              - label:
                  id: lbl_elec
                  x: 14
                  y: 38
                  width: 120
                  height: 32
                  text: !lambda |-
                    float e = id(ha_elec).has_state() ? id(ha_elec).state : NAN;
                    if (!std::isfinite(e)) return std::string("--");
                    char buf[16];
                    snprintf(buf, sizeof(buf), "¥%.1f", e);
                    return std::string(buf);
                  text_font: font_cn_24
                  text_align: center
                  text_color: !lambda |-
                    float e = id(ha_elec).has_state() ? id(ha_elec).state : NAN;
