# ============================================================
# ESP32-S3 ESP32-4848S040 智能家庭控制面板 · 中文 5 屏 真真梦2026-11 原文链接https://post.smzdm.com/p/ad7mk30x/
# 方案: ESPHome + Home Assistant (原生集成)
# 硬件: 4.0" 480x480 IPS (ST7701) + GT911 触摸 + 一路继电器 + SHT20 温湿度(如有)
# 使用: 见 README.md (安装/烧录/HA 接入/故障排查)
# ============================================================

substitutions:
  # 设备名(小写字母数字下划线)
  name: esp32-panel
  friendly_name: 智能控制面板
  device_description: ESP32-S3 ESP32-4848S040 86型智能面板
  # ★★★ 继电器要控制的灯的名字，直接改成你的（如：客厅灯L / 卧室灯L / 门厅灯L）
  # 提醒: 名字需含至少一个 ASCII 字母/数字(L=Light 灯), 纯中文名会与其他中文实体冲突
  relay_name: 客厅灯L
  # 继电器 GPIO (出厂默认 IO40 --R25--> relay1，与 I2S 音频共用，板上默认接继电器)
  relay_pin: GPIO40
  # ★ 主页显示的家庭名 (直接改成你的, 如: 温馨之家 / 幸福小窝)
  home_name: 温馨之家
  # ★ 主页 6 类扩展数据 + 通知, 默认订阅的 HA 中间实体 (在 HA 里建同名 template sensor 指向真实数据源)
  #   温度:     sensor.panel_temp   湿度: sensor.panel_hum
  #   空气质量: sensor.panel_air    水质:  sensor.panel_water
  #   电费余额: sensor.panel_elec   包裹:  sensor.panel_package
  #   通知栏:   sensor.panel_notice
  temp_entity: sensor.panel_temp
  hum_entity: sensor.panel_hum
  air_entity: sensor.panel_air
  water_entity: sensor.panel_water
  elec_entity: sensor.panel_elec
  pkg_entity: sensor.panel_package
  notice_entity: sensor.panel_notice
  # 地理编码失败时的兜底坐标 (北京); 正常天气按面板城市名经地理编码动态定位
  w_lat: "30.05"
  w_lon: "103.83"
  # ★ HA Logbook 直读默认值: 首次烧录后在面板网页(http://面板IP)或HA里直接改, 存NVS免刷机
  #   令牌获取: HA 左下角头像 -> 个人设置 -> 长期访问令牌 -> 创建令牌, 整串粘贴到「HA令牌」
  ha_host: "192.168.1.10:8123"
  ha_token: ""
  # ★ 墨水屏推送策略: 开机后延迟 N 秒推第一次 (墨水屏已连接才推)
  #   推送间隔像家庭名一样在此设置(分钟); 若 HA 里有 number.epd_push_interval_min 则以 HA 值为准(免刷机)
  epd_first_delay_s: 30
  epd_push_interval_min: "30"
  # ★ 首页卡1(原"系统"卡) 自定义: 名称 + 数据实体(HA sensor), 如 快递/新闻/门磁/能耗 等
  #   名称 → text.卡1名称 (HA 里改, 免刷机); 数据 → 绑 HA 中间实体 sensor.panel_card1 (HA 模板里指向任意实体, 换数据只改 HA, 免刷机)
  card1_title: 系统
  card1_entity: sensor.panel_card1

  # ============================================================
  # ★★★ 设备实体映射表 (换设备/发给别人时，只改这一张表) ★★★
  # 下面都是你家 HA 里真实的 entity_id；改成自己的即可，
  # 面板内所有订阅、按钮、滑条都引用这里，不用到处找。
  # 说明: 中间聚合实体(sensor.panel_*)走 HA 模板，见 README 第六节，不在本表。
  # ============================================================
  # --- 墨水屏 BLE (固定配对, 编译期配置) ---
  epd_mac: "AA:BB:CC:DD:EE:FF"  # 改成你墨水屏的真实BLE MAC
  # --- ESP32 Monitor 全家桶状态页地址 (另一台 ESP32 提供纯文本接口) ---
  monitor_url: "http://192.168.1.20/api/text"
  # --- 首页卡2 原始传感器 (进/出风温度、PC/NAS/3D打印机功率) ---
  ac_in_temp: sensor.<进风温度实体>
  balcony_temp: sensor.<阳台温度实体>
  pc_power: sensor.<电脑功率实体>
  nas_power: sensor.<NAS功率实体>
  p3d_power: sensor.<3D打印机功率实体>
  # --- 灯光页 4 盏灯 (按钮位置: L1无 / L2吸顶灯 / L3台灯 / L4吊灯 / L5阳台灯) ---
  light2: light.<吸顶灯实体>
  light3: light.<吊灯实体>
  light4: light.<阳台灯实体>
  light5: light.<灯5实体>
  strip_light: light.<灯带实体>
  # --- 窗帘 ---
  curtain: cover.<窗帘实体>
  # --- 燃气热水器 ---
  wh_switch: switch.ran_qi_re_shui_qi_kai_guan_ji_zhuang_tai
  wh_target_temp: number.ran_qi_re_shui_qi_mu_biao_wen_du
  wh_mode: select.ran_qi_re_shui_qi_xi_yu_zhuang_tai
  wh_in_temp: sensor.ran_qi_re_shui_qi_jin_shui_wen_du
  wh_out_temp: sensor.ran_qi_re_shui_qi_chu_shui_wen_du
  wh_flame: binary_sensor.ran_qi_re_shui_qi_huo_yan_you_wu
  # --- 空调 ---
  ac: climate.<空调实体>
  # --- 其他开关 ---
  misc_switch1: switch.<其他开关实体>
  # --- 场景页 8 个场景 (HA 里 script/scene 的 entity_id) ---
  scene_home: scene.<回家场景>
  scene_leave: scene.<离家场景>
  scene_sleep: scene.<睡眠场景>
  scene_off_all: scene.<观影场景>
  scene_fan: scene.<通风场景>
  scene_guard: scene.<布防场景>
  scene_garage: scene.<车库场景>
  scene_all_off: scene.<全关场景>

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${device_description}
  # 自定义分区: app 分区加大, 容纳中文字库 (16MB flash)
  platformio_options:
    board_build.partitions: partitions.csv
  project:
    name: diy.esp32-panel
    version: "1.0.0"
  # 开机: 读取 text 实体设置的间隔(分钟) + 延迟 ${epd_first_delay_s} 秒排首次推送
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // g_screen_timeout_s 由全局自身 NVS restore, 不在此被 text 覆盖; text on_value 仍会同步
          id(g_bright_norm) = 1.0;
          id(g_asleep) = false;
          id(g_last_touch_ms) = millis();
          int v = atoi(id(epd_interval_text).state.c_str());
          if (v < 0) v = 5;
          if (v > 1440) v = 1440;
          id(epd_push_interval_s) = v * 60;   // text 实体(HA 可改) 优先级最高; 0 = 停推
          if (v == 0) {
            id(g_epd_status) = "推送已停用(间隔=0)";
            id(epd_next_push_at) = 0xFFFFFFFF;   // 永不推送
            id(epd).set_auto_connect(false);
          } else {
            id(epd_next_push_at) = (uint32_t) (millis() + ${epd_first_delay_s} * 1000);
            // 开机即待命扫描连接(无需手动点一次切换才触发), 到点直接推; 推完脚本内会断开并关 auto_connect
            id(epd).set_auto_connect(true);
          }

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: 5.4.2
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: "y"
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

# 8MB Octal PSRAM
psram:
  mode: octal
  speed: 80MHz

logger:
  level: VERY_VERBOSE

# 待写偏好每100ms批量落一次NVS(默认60s), 保证改完短时间内重启也不丢设置
preferences:
  flash_write_interval: 100ms

# Home Assistant 原生接入(通过 API)
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # 断网时自动开热点供配网
  ap:
    ssid: "${name}-fallback"
    password: !secret ap_password
  # 连接 WiFi 后先地理编码城市, 成功后自动拉天气 (Open-Meteo, 免 key)
  on_connect:
    then:
      - script.execute: fetch_geo
      - script.execute: fetch_logbook

# BLE 扫描 (墨水屏 NRF_EPD 发现 + MAC 显示)
# 平时低占空比偶扫, 避免全速常驻扫描抢 CPU/射频导致切页卡顿; 墨水屏按已知MAC主动连接, 不依赖持续扫描
esp32_ble_tracker:
  scan_parameters:
    interval: 5s
    window: 30ms
  on_ble_advertise:
    - then:
        - lambda: |-
            std::string nm = std::string(x.get_name());
            if (nm.find("NRF_EPD") != std::string::npos) {
              id(g_epd_mac) = x.address_str();
              ESP_LOGI("epd", "EPD device: %s", id(g_epd_mac).c_str());
            }

# 墨水屏 BLE 客户端 (EPD-nRF5_DYC, SSD1619 400x300 三色)
ble_client:
  - id: epd
    mac_address: "${epd_mac}"
    auto_connect: false   # 关闭自动重连: 推送完成主动断开后不马上重连, 由推送状态机到点主动 connect
    on_connect:
      then:
        - logger.log:
            format: "EPD connected: %s"
            args: ["id(g_epd_mac).c_str()"]
        - lambda: |-
            id(g_epd_status) = "已连接，等待定时推送";
            id(epd_connected) = true;
            // 若是推送到点时的主动重连: 连接成功后 1s 立即推送(不等下一个间隔)
            if (id(g_epd_reconnect_requested)) {
              id(g_epd_reconnect_requested) = false;
              id(epd_next_push_at) = (uint32_t)(millis() + 1000);
            }
    on_disconnect:
      then:
        - logger.log: "EPD disconnected"
        - lambda: |-
            id(g_epd_status) = "墨水屏已断开";
            id(epd_connected) = false;

# 可选: 局域网固定 IP (更稳), 取消注释并填写
#   manual_ip:
#     static_ip: 192.168.1.88
#     gateway: 192.168.1.1
#     subnet: 255.255.255.0

# 浏览器调试页 http://<ip>
web_server:
  port: 80

# ---------------- 时间(首页大时钟) ----------------
time:
  - platform: sntp
    id: my_time
    servers:
      - pool.ntp.org
    on_time:
      # 每秒刷新时钟/日期 label (lvgl.widget.refresh 会重新求值 label 的动态 text)
      - seconds: /1
        then:
          - lvgl.widget.refresh: [lbl_time, lbl_date, lbl_weather_icon, lbl_home_name, lbl_wifi_icon]

      # 深夜自动模式: 每分钟检查时间, 23:00-07:00 切家庭页+背光30%, 白天切回首页+背光100%
      - minutes: /1
        then:
          - lambda: |-
              if (!id(g_night_mode)) {
                if (id(g_night_active)) {
                  id(g_night_active) = false;
                  id(g_bright_norm) = 1.0;
                }
                return;
              }
              if (!id(my_time).now().is_valid()) return;
              int h = id(my_time).now().hour;
              bool is_night = (h >= 23 || h < 7);
              if (is_night == id(g_night_active)) return;
              id(g_night_active) = is_night;
              id(g_bright_norm) = is_night ? 0.3f : 1.0f;
          - if:
              condition:
                lambda: 'return id(g_night_active);'
              then:
                - light.turn_on:
                    id: backlight
                    brightness: 0.3
              else:
                - light.turn_on:
                    id: backlight
                    brightness: 1.0

# ---------------- 传感器 ----------------
sensor:
  # WiFi 信号
  - platform: wifi_signal
    name: WiFi信号
    id: wifi_sig
    update_interval: 30s
  # 运行时长 (名字带 ASCII 后缀 U, 避免与纯中文实体名冲突)
  - platform: uptime
    name: 运行时间U
    id: up_sensor
    update_interval: 60s
  # ---------- 主页 6 卡数据 (全部订阅 HA 中间实体, 在 HA 里配置指向真实数据源) ----------
  - platform: homeassistant
    id: ha_temp
    entity_id: ${temp_entity}
  - platform: homeassistant
    id: ha_hum
    entity_id: ${hum_entity}
  - platform: homeassistant
    id: ha_air
    entity_id: ${air_entity}
  - platform: homeassistant
    id: ha_water
    entity_id: ${water_entity}
  - platform: homeassistant
    id: ha_elec
    entity_id: ${elec_entity}
  # 首页卡1 自定义实体 (标题/实体在顶部 substitutions 配置)
  - platform: homeassistant
    id: ha_card1
    entity_id: ${card1_entity}

# 可配置文本 (家庭名/问候语): HA 里可直接编辑, 面板实时显示; 未来配置页复用
text:
  - platform: template
    id: home_name_text
    name: 家庭名称
    mode: TEXT
    optimistic: true
    initial_value: "${home_name}"
    restore_value: true
  - platform: template
    id: home_quote
    name: 面板问候语
    mode: TEXT
    optimistic: true
    initial_value: "欢迎回家"
    restore_value: true
    on_value:
      then:
        - lambda: 'id(g_greet_seg) = 0;'
        - lvgl.widget.refresh: lbl_greet
  # 墨水屏推送间隔(分钟): HA 里直接改数值(5~1440), 免刷机; 与家庭名称同为 text 实体
  - platform: template
    id: epd_interval_text
    name: 墨水屏推送间隔(分钟)
    mode: TEXT
    optimistic: true
    initial_value: "${epd_push_interval_min}"
    restore_value: true
    on_value:
      then:
        - lambda: |-
            int v = atoi(id(epd_interval_text).state.c_str());
            if (v < 0) v = 5;
            if (v > 1440) v = 1440;
            id(epd_push_interval_s) = v * 60;
            if (v == 0) {
              id(g_epd_status) = "推送已停用(间隔=0)";
              id(epd_next_push_at) = 0xFFFFFFFF;   // 0 = 停推
              id(epd).set_auto_connect(false);
            } else {
              id(epd).set_auto_connect(true);
              // 开机实体晚于 on_boot 恢复: 若被误置停推, 这里自愈并补排首次推送
              if (id(epd_next_push_at) == 0xFFFFFFFF)
                id(epd_next_push_at) = (uint32_t)(millis() + 3000);
            }
            ESP_LOGI("epd", "push interval set: %d min -> %d s", v, v * 60);
  # 背景主题: "0"=深蓝 "1"=深紫 "2"=深粉
  - platform: template
    id: bg_theme_text
    name: 面板背景主题
    mode: TEXT
    optimistic: true
    initial_value: "0"
    restore_value: true
  # 自动熄屏(秒): HA/面板直接改, 存NVS免刷机; 0=永不熄屏, 范围0~3600
  - platform: template
    id: screen_timeout_text
    name: 自动熄屏(秒)
    mode: TEXT
    optimistic: true
    initial_value: "120"
    restore_value: true
    on_value:
      then:
        - lambda: |-
            int v = atoi(id(screen_timeout_text).state.c_str());
            if (v < 0) v = 0;
            if (v > 3600) v = 3600;
            id(g_screen_timeout_s) = v;
            ESP_LOGI("screen", "timeout set: %d s", v);
  # 首页卡1 名称: HA 里直接改(如 快递/大门/今日用电), 免刷机
  - platform: template
    id: card1_title_text
    name: 卡1名称
    mode: TEXT
    optimistic: true
    initial_value: "${card1_title}"
    restore_value: true
  # 天气城市: 既是屏幕显示名, 也是天气地理编码输入; 改名字后自动重新定位并拉天气
  - platform: template
    id: city_text
    name: 天气城市(city)
    mode: TEXT
    optimistic: true
    initial_value: "北京"
    restore_value: true
    on_value:
      then:
        - script.execute: fetch_geo
  # HA 内网地址(不带 http://, 如 192.168.1.10:8123): 面板网页/HA 直接改, 存本地NVS, 免刷机
  - platform: template
    id: ha_host_text
    name: HA地址(host)
    mode: TEXT
    optimistic: true
    initial_value: "${ha_host}"
    restore_value: true
    on_value:
      then:
        - script.execute: fetch_logbook
  # HA 长期访问令牌: 面板网页/HA 直接填, 存本地NVS, 免刷机; 留空则活动页提示未配置
  - platform: template
    id: ha_token_text
    name: HA令牌(token)
    mode: TEXT
    optimistic: true
    initial_value: "${ha_token}"
    restore_value: true
    on_value:
      then:
        - script.execute: fetch_logbook

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP地址
      id: ip_addr
  # 包裹/通知 (HA 中间实体, 文本型)
  - platform: homeassistant
    id: ha_package
    entity_id: ${pkg_entity}
  - platform: homeassistant
    id: ha_notice
    entity_id: ${notice_entity}
  # 家庭信息页 2 个文本实体 (HA 模板聚合, 支持 LVGL recolor 颜色标签 #RRGGBB文字#)
  - platform: homeassistant
    id: ha_family_presence
    entity_id: sensor.panel_family_presence
  - platform: homeassistant
    id: ha_family_env
    entity_id: sensor.panel_family_env
  # 第三卡: 用电(今年电费/当月用电/上月电费/昨日用电)+HA主机(NAS)状态, HA模板聚合
  - platform: homeassistant
    id: ha_family_bill
    entity_id: sensor.panel_bill_nas
  # 卡1房间有人/无人独立文本(分色)
  - platform: homeassistant
    id: ha_room_living
    entity_id: sensor.panel_room_living
  - platform: homeassistant
    id: ha_room_master
    entity_id: sensor.panel_room_master
  - platform: homeassistant
    id: ha_room_bath2
    entity_id: sensor.panel_room_bath2
  - platform: homeassistant
    id: ha_room_bath1
    entity_id: sensor.panel_room_bath1
  # 卡2 原始传感器(直接订阅, 固件分色)
  - platform: homeassistant
    id: ha_temp_in
    entity_id: ${ac_in_temp}
  - platform: homeassistant
    id: ha_temp_bal
    entity_id: ${balcony_temp}
  - platform: homeassistant
    id: ha_pc
    entity_id: ${pc_power}
  - platform: homeassistant
    id: ha_nas
    entity_id: ${nas_power}
  - platform: homeassistant
    id: ha_p3d
    entity_id: ${p3d_power}
  # ===== 灯光页 按钮2~5 灯状态回显(订阅 light 实体 on/off; 换灯改 entity_id) =====
  - platform: homeassistant
    id: ha_l2_state
    entity_id: ${light2}
  - platform: homeassistant
    id: ha_l3_state
    entity_id: ${light3}
  - platform: homeassistant
    id: ha_l4_state
    entity_id: ${light4}
  - platform: homeassistant
    id: ha_l5_state
    entity_id: ${light5}
  # 吸顶灯 亮度/色温: 不做回显(米家量化档位差会来回跳), 滑条纯单向发送, 拖到什么值给灯什么值
  # 窗帘当前开合度(0全关~100全开), 用于滑条位置回显
  - platform: homeassistant
    id: ha_curtain_pos
    entity_id: ${curtain}
    attribute: current_position
    on_value:
      then:
        - lambda: 'id(g_cur_sync) = true;'
        # HA position 100=全开; 滑条反转 0=全开 100=全关 -> 滑条值=100-p
        - lvgl.slider.update:
            id: demo_curtain_slider
            value: !lambda |-
                float p = atof(id(ha_curtain_pos).state.c_str());
                return 100.0f - p;
  # ===== 开关页 热水器/空调 回显 =====
  - platform: homeassistant
    id: ha_wh_sw
    entity_id: ${wh_switch}
  - platform: homeassistant
    id: ha_wh_temp
    entity_id: ${wh_target_temp}
  - platform: homeassistant
    id: ha_wh_mode
    entity_id: ${wh_mode}
  # 热水器 进/出水温度(华氏, 固件内转摄氏) + 火焰有无(运行状态)
  - platform: homeassistant
    id: ha_wh_in
    entity_id: ${wh_in_temp}
